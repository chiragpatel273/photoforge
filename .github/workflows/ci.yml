name: Validate PhotoForge
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm --filter @photoforge/shared build
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker compose --env-file .env.example config --no-env-resolution --quiet
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: false
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @photoforge/shared build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose exec -T api pnpm test:integration tests/api.integration.test.ts tests/jobs.integration.test.ts
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
      - if: always()
        run: docker compose down -v
